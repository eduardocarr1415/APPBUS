{% extends 'base.html' %}{% block title %}Buscar{% endblock %}{% block content %}<div class="heading-row"><div><h1>Resultados de búsqueda</h1><p>Resultados para: <b>{{ q }}</b></p></div></div><section class="panel">{% for r in results %}<a class="search-result" href="{{ r.url }}"><b>{{ r.title }}</b><small>{{ r.detail }}</small></a>{% else %}<p class="muted">No se encontraron coincidencias o no hay permisos para acceder a ellas.</p>{% endfor %}</section>{% endblock %}
