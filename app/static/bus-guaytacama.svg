<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" fill="none">
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="busBodyG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="windG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Background mountain badge -->
  <rect width="320" height="140" rx="14" fill="url(#skyG)"/>
  
  <!-- Andes / Cotopaxi Silhouette -->
  <polygon points="40,95 90,45 140,95" fill="#334155" opacity="0.4"/>
  <polygon points="110,95 180,30 250,95" fill="#475569" opacity="0.5"/>
  <!-- Snow cap -->
  <polygon points="165,42 180,30 195,42 187,46 180,43 173,46" fill="#f8fafc" opacity="0.8"/>
  <polygon points="210,95 260,50 300,95" fill="#334155" opacity="0.4"/>

  <!-- Highway asphalt -->
  <rect x="0" y="95" width="320" height="45" fill="#0f172a"/>
  <line x1="0" y1="96" x2="320" y2="96" stroke="#475569" stroke-width="2"/>
  <line x1="10" y1="118" x2="70" y2="118" stroke="#facc15" stroke-width="3" stroke-dasharray="14 10"/>
  <line x1="100" y1="118" x2="310" y2="118" stroke="#facc15" stroke-width="3" stroke-dasharray="14 10"/>

  <!-- Shadow under bus -->
  <ellipse cx="160" cy="98" rx="115" ry="5" fill="#000" opacity="0.6"/>

  <!-- Bus Body (Coach style) -->
  <path d="M 45 42 Q 52 38 70 38 L 245 38 Q 262 38 274 50 L 285 75 Q 288 84 286 92 L 45 92 Q 40 92 40 85 L 40 48 Q 40 42 45 42 Z" fill="url(#busBodyG)"/>
  
  <!-- Dynamic yellow & white vinyl swoosh -->
  <path d="M 45 74 Q 130 65 240 58 L 278 68 L 285 78 L 45 84 Z" fill="#f59e0b"/>
  <path d="M 45 77 Q 140 68 250 63 L 265 67 L 45 82 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Aerodynamic roof air unit -->
  <rect x="110" y="34" width="90" height="5" rx="2" fill="#94a3b8"/>

  <!-- LED Display: GUAYTACAMA -->
  <rect x="220" y="42" width="52" height="9" rx="2" fill="#090d16" stroke="#334155" stroke-width="0.8"/>
  <text x="246" y="49" fill="#facc15" font-size="6" font-family="monospace" font-weight="bold" text-anchor="middle">GUAYTACAMA</text>

  <!-- Front Windshield -->
  <path d="M 226 53 L 268 53 L 280 72 L 226 72 Z" fill="url(#windG)"/>
  <line x1="252" y1="53" x2="252" y2="72" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Passenger Windows -->
  <rect x="52" y="48" width="30" height="20" rx="3" fill="url(#windG)"/>
  <rect x="86" y="48" width="32" height="20" rx="3" fill="url(#windG)"/>
  <rect x="122" y="48" width="32" height="20" rx="3" fill="url(#windG)"/>
  <rect x="158" y="48" width="32" height="20" rx="3" fill="url(#windG)"/>
  <rect x="194" y="48" width="28" height="20" rx="3" fill="url(#windG)"/>

  <!-- Passenger silhouettes -->
  <circle cx="67" cy="58" r="3.5" fill="#1e293b" opacity="0.7"/>
  <circle cx="102" cy="58" r="3.5" fill="#1e293b" opacity="0.7"/>
  <circle cx="138" cy="58" r="3.5" fill="#1e293b" opacity="0.7"/>
  <circle cx="174" cy="58" r="3.5" fill="#1e293b" opacity="0.7"/>

  <!-- Headlights -->
  <polygon points="286,82 320,70 320,105 286,88" fill="#fef08a" opacity="0.35"/>
  <circle cx="284" cy="85" r="3.5" fill="#fef08a"/>
  
  <!-- Rear Taillights -->
  <rect x="39" y="76" width="3" height="10" rx="1" fill="#ef4444"/>

  <!-- Side Mirror -->
  <path d="M 268 45 Q 278 43 282 50" stroke="#0f172a" stroke-width="1.5" fill="none"/>
  <rect x="280" y="48" width="3" height="8" rx="1" fill="#0f172a"/>

  <!-- Front Wheel -->
  <g transform="translate(242, 95)">
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#cbd5e1"/>
    <circle cx="0" cy="0" r="4" fill="#64748b"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#0f172a" stroke-width="1.5"/>
  </g>

  <!-- Rear Wheels (Dual Axle) -->
  <g transform="translate(108, 95)">
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#cbd5e1"/>
    <circle cx="0" cy="0" r="4" fill="#64748b"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#0f172a" stroke-width="1.5"/>
  </g>
  <g transform="translate(74, 95)">
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#cbd5e1"/>
    <circle cx="0" cy="0" r="4" fill="#64748b"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#0f172a" stroke-width="1.5"/>
  </g>

  <!-- Text Badge -->
  <rect x="90" y="12" width="140" height="18" rx="9" fill="#0f172a" opacity="0.8" stroke="#f59e0b" stroke-width="1"/>
  <text x="160" y="24" fill="#f8fafc" font-size="9" font-family="sans-serif" font-weight="900" letter-spacing="1.2" text-anchor="middle">BUSES GUAYTACAMA</text>
</svg>
