<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="100%" height="auto">
  <defs>
    <!-- Background Sky Gradient -->
    <linearGradient id="cardSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="45%" stop-color="#0f1f38"/>
      <stop offset="80%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0c1424"/>
    </linearGradient>

    <!-- Metallic Blue Coach Paint Gradient -->
    <linearGradient id="busBlueMetallic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="30%" stop-color="#1d4ed8"/>
      <stop offset="70%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f224a"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Chrome Silver Gradient -->
    <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Tinted Windshield Glass Gradient -->
    <linearGradient id="windshield3D" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#0369a1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Headlight Glow Filter -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect x="1" y="1" width="378" height="228" rx="16" fill="url(#cardSky)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Subtle Andes / Cotopaxi Silhouette in Background -->
  <g opacity="0.4">
    <polygon points="20,130 90,75 160,130" fill="#1e293b"/>
    <polygon points="240,130 310,70 380,130" fill="#1e293b"/>
    <!-- Cotopaxi Peak (Center) -->
    <polygon points="110,130 190,40 270,130" fill="#334155"/>
    <!-- Cotopaxi Snowcap -->
    <polygon points="170,62 190,40 210,62 200,68 190,64 180,68" fill="#f8fafc" opacity="0.95"/>
  </g>

  <!-- Ground Perspective / Asphalt Platform -->
  <polygon points="0,140 380,140 380,230 0,230" fill="#090d16"/>
  <line x1="0" y1="140" x2="380" y2="140" stroke="#1e293b" stroke-width="2"/>
  <!-- Perspective roadway markings -->
  <line x1="190" y1="140" x2="100" y2="230" stroke="#e2e8f0" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="12 8"/>
  <line x1="190" y1="140" x2="280" y2="230" stroke="#e2e8f0" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="12 8"/>

  <!-- Ambient Light Cone on Road from Bus Headlights -->
  <polygon points="175,152 70,225 310,225 245,152" fill="#fef08a" opacity="0.12"/>

  <!-- SHADOW UNDER COACH BUS -->
  <ellipse cx="210" cy="168" rx="120" ry="12" fill="#000000" opacity="0.85"/>

  <!-- ============================================== -->
  <!-- 3/4 PERSPECTIVE LUXURY COACH BUS (MARCOPOLO G8 STYLE) -->
  <!-- ============================================== -->
  <g transform="translate(15, -4)">

    <!-- SIDE FLANK (Receding into depth to the left) -->
    <path d="M 100 68 L 195 62 L 195 162 L 100 154 Z" fill="url(#busBlueMetallic)" stroke="#1e3a8a" stroke-width="1"/>

    <!-- Side Passenger Windows (Angled Perspective) -->
    <polygon points="105,74 190,68 190,105 105,108" fill="url(#windshield3D)"/>
    <!-- Window divider pillars -->
    <line x1="124" y1="73" x2="124" y2="107" stroke="#0f172a" stroke-width="2"/>
    <line x1="146" y1="71" x2="146" y2="106" stroke="#0f172a" stroke-width="2"/>
    <line x1="168" y1="70" x2="168" y2="106" stroke="#0f172a" stroke-width="2"/>
    <!-- Warm interior VIP curtains glow -->
    <path d="M 108 77 Q 115 85 115 105 L 121 105 Q 121 85 118 77 Z" fill="#fef08a" opacity="0.35"/>
    <path d="M 130 76 Q 137 84 137 105 L 143 105 Q 143 84 140 76 Z" fill="#fef08a" opacity="0.35"/>
    <path d="M 152 75 Q 159 83 159 105 L 165 105 Q 165 83 162 75 Z" fill="#fef08a" opacity="0.35"/>

    <!-- Side Dynamic Swoosh Livery -->
    <path d="M 100 134 Q 145 125 195 114 L 195 124 Q 145 133 100 142 Z" fill="url(#goldGrad)"/>
    <path d="M 100 138 Q 145 130 195 121 L 195 126 Q 145 134 100 144 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Side Lettering -->
    <text x="112" y="128" fill="#ffffff" font-size="8.5" font-family="'Segoe UI', sans-serif" font-weight="900" letter-spacing="1.5" transform="rotate(-4, 112, 128)">GUAYTACAMA</text>

    <!-- Side Luggage Hatches -->
    <line x1="102" y1="147" x2="148" y2="143" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="120" y="143" width="6" height="2" rx="1" fill="#94a3b8"/>

    <!-- Rear/Mid Wheel in Perspective -->
    <ellipse cx="116" cy="154" rx="12" ry="16" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
    <ellipse cx="116" cy="154" rx="7" ry="10" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <ellipse cx="116" cy="154" rx="3" ry="4" fill="#0f172a"/>

    <!-- ============================================== -->
    <!-- FRONT FASCIA (Dominant, Facing Viewer at 3/4) -->
    <!-- ============================================== -->
    <!-- Front Body Shell -->
    <path d="M 195 62 Q 248 58 290 64 Q 298 66 300 78 L 302 145 Q 302 165 285 168 L 210 166 Q 195 164 195 152 Z" fill="url(#busBlueMetallic)" stroke="#1d4ed8" stroke-width="1.5"/>

    <!-- Roof Aerodynamic Spoiler / Pod -->
    <path d="M 175 58 L 295 60 Q 304 62 301 68 L 190 64 Z" fill="url(#chromeGrad)"/>

    <!-- ELECTRONIC LED DESTINATION MATRIX SIGN -->
    <rect x="212" y="68" width="80" height="15" rx="3" fill="#050811" stroke="#334155" stroke-width="1"/>
    <text x="252" y="79" fill="#fbbf24" font-size="8.5" font-family="'Courier New', monospace" font-weight="900" letter-spacing="1" text-anchor="middle" filter="url(#glowFilter)">★ GUAYTACAMA ★</text>

    <!-- UPPER DECK PANORAMIC WINDSHIELD (PASSENGERS) -->
    <path d="M 200 87 L 296 89 Q 298 106 295 110 L 198 108 Q 197 96 200 87 Z" fill="url(#windshield3D)" stroke="#090d16" stroke-width="1.5"/>
    <!-- Center Split Pillar -->
    <line x1="248" y1="87" x2="247" y2="110" stroke="#090d16" stroke-width="2.5"/>
    <!-- Upper Windshield Glass Glare -->
    <polygon points="215,89 235,89 220,108 205,108" fill="#ffffff" opacity="0.2"/>

    <!-- Inter-Deck Aerodynamic Chrome Divider Bar -->
    <path d="M 197 109 L 297 111 L 296 115 L 197 113 Z" fill="url(#chromeGrad)"/>

    <!-- LOWER DECK WINDSHIELD (CABIN &amp; DRIVER) -->
    <path d="M 198 114 L 296 116 Q 297 132 294 135 L 198 133 Q 197 124 198 114 Z" fill="url(#windshield3D)" stroke="#090d16" stroke-width="1.5"/>
    <!-- Windshield Wipers -->
    <line x1="225" y1="133" x2="238" y2="123" stroke="#0f172a" stroke-width="2"/>
    <line x1="270" y1="134" x2="282" y2="124" stroke="#0f172a" stroke-width="2"/>
    <!-- Driver Silhouette &amp; Steering Wheel -->
    <circle cx="228" cy="124" r="4.5" fill="#090d16" opacity="0.8"/>
    <ellipse cx="228" cy="130" rx="5" ry="2" fill="#090d16" opacity="0.7"/>

    <!-- FRONT BUMPER &amp; RADIATOR GRILLE (MODERN HEXAGONAL MESH) -->
    <path d="M 198 136 L 294 138 L 292 165 Q 275 168 245 168 Q 215 167 198 163 Z" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Central Chrome Grille Insert -->
    <rect x="225" y="145" width="46" height="12" rx="2" fill="#1e293b" stroke="url(#chromeGrad)" stroke-width="1"/>
    <!-- Grille Mesh Louvers -->
    <line x1="228" y1="148" x2="268" y2="148" stroke="#475569" stroke-width="1"/>
    <line x1="228" y1="151" x2="268" y2="151" stroke="#475569" stroke-width="1"/>
    <line x1="228" y1="154" x2="268" y2="154" stroke="#475569" stroke-width="1"/>

    <!-- GOLD GUAYTACAMA FRONT EMBLEM WINGS -->
    <polygon points="248,142 243,145 253,145" fill="url(#goldGrad)"/>
    <circle cx="248" cy="145" r="2.5" fill="url(#goldGrad)"/>

    <!-- HEADLIGHT CLUSTERS (LED DRL SIGNATURE &amp; XENON PROJECTORS) -->
    <!-- Left Cluster (Front Perspective) -->
    <g>
      <path d="M 203 138 L 218 139 L 217 149 L 204 146 Z" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <!-- Sharp LED DRL Wing -->
      <path d="M 204 139 L 217 140" stroke="#ffffff" stroke-width="2" filter="url(#glowFilter)"/>
      <!-- Xenon Projector Lamp -->
      <circle cx="210" cy="144" r="3.5" fill="#fef08a" filter="url(#glowFilter)"/>
      <circle cx="210" cy="144" r="1.8" fill="#ffffff"/>
    </g>

    <!-- Right Cluster (Front Perspective) -->
    <g>
      <path d="M 276 140 L 291 141 L 288 150 L 275 148 Z" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <!-- Sharp LED DRL Wing -->
      <path d="M 276 141 L 290 142" stroke="#ffffff" stroke-width="2" filter="url(#glowFilter)"/>
      <!-- Xenon Projector Lamp -->
      <circle cx="283" cy="145" r="3.5" fill="#fef08a" filter="url(#glowFilter)"/>
      <circle cx="283" cy="145" r="1.8" fill="#ffffff"/>
    </g>

    <!-- Fog Lamps in Lower Bumper Splitter -->
    <circle cx="212" cy="157" r="2" fill="#fef08a" filter="url(#glowFilter)"/>
    <circle cx="278" cy="159" r="2" fill="#fef08a" filter="url(#glowFilter)"/>

    <!-- OFFICIAL ECUADORIAN VEHICLE LICENSE PLATE -->
    <g transform="translate(236, 159)">
      <rect x="0" y="0" width="24" height="9" rx="1.5" fill="#ffffff" stroke="#0f172a" stroke-width="0.6"/>
      <!-- Tricolor Header Bar (Amarillo, Azul, Rojo) -->
      <rect x="0.5" y="0.5" width="23" height="1.2" fill="#facc15"/>
      <rect x="0.5" y="1.7" width="23" height="0.7" fill="#2563eb"/>
      <rect x="0.5" y="2.4" width="23" height="0.7" fill="#dc2626"/>
      <text x="12" y="7.2" fill="#090d16" font-size="4.5" font-family="'Segoe UI', monospace" font-weight="900" letter-spacing="0.5" text-anchor="middle">XAA-1234</text>
    </g>

    <!-- UNIT BADGE -->
    <rect x="282" y="125" width="14" height="7" rx="1.5" fill="#090d16" stroke="url(#goldGrad)" stroke-width="0.8"/>
    <text x="289" y="130.5" fill="#fbbf24" font-size="4" font-family="sans-serif" font-weight="bold" text-anchor="middle">N° 14</text>

    <!-- FRONT RIGHT WHEEL (Turned in 3D Perspective) -->
    <g transform="translate(288, 166)">
      <!-- Outer Rubber Tire Tread -->
      <ellipse cx="0" cy="0" rx="12" ry="16" fill="#090d16" stroke="#1e293b" stroke-width="2.5"/>
      <!-- Alloy Wheel Rim (High-Spec Polished Chrome) -->
      <ellipse cx="-1" cy="0" rx="7" ry="11" fill="url(#chromeGrad)" stroke="#0f172a" stroke-width="1.2"/>
      <ellipse cx="-1" cy="0" rx="3.5" ry="5.5" fill="#1e293b"/>
      <!-- Chrome Center Nut -->
      <ellipse cx="-1" cy="0" rx="1.5" ry="2.5" fill="#f8fafc"/>
    </g>

    <!-- FRONT LEFT WHEEL (Under front bumper) -->
    <ellipse cx="208" cy="165" rx="9" ry="13" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
    <ellipse cx="208" cy="165" rx="5" ry="8" fill="#475569"/>

    <!-- AERODYNAMIC DUAL SIDE MIRRORS ("OREJAS DE AUTOBÚS") -->
    <!-- Left Mirror -->
    <path d="M 197 78 Q 183 72 178 86" stroke="#090d16" stroke-width="2.5" fill="none"/>
    <rect x="175" y="82" width="5" height="16" rx="2.5" fill="#090d16" stroke="#1e3a8a" stroke-width="0.8"/>
    <rect x="176" y="84" width="2.8" height="12" rx="1" fill="#e2e8f0"/>
    <!-- Amber LED indicator strip on mirror -->
    <line x1="175" y1="90" x2="175" y2="95" stroke="#f59e0b" stroke-width="1.2" filter="url(#glowFilter)"/>

    <!-- Right Mirror -->
    <path d="M 298 78 Q 312 72 318 86" stroke="#090d16" stroke-width="2.5" fill="none"/>
    <rect x="315" y="82" width="5" height="16" rx="2.5" fill="#090d16" stroke="#1e3a8a" stroke-width="0.8"/>
    <rect x="316" y="84" width="2.8" height="12" rx="1" fill="#e2e8f0"/>
    <line x1="320" y1="90" x2="320" y2="95" stroke="#f59e0b" stroke-width="1.2" filter="url(#glowFilter)"/>

  </g>

  <!-- ============================================== -->
  <!-- EXECUTIVE GOLD BADGE &amp; RIBBON AT FOOT OF CARD  -->
  <!-- ============================================== -->
  <g transform="translate(15, 184)">
    <!-- Plaque Background -->
    <rect x="0" y="0" width="350" height="38" rx="8" fill="#070d18" stroke="url(#goldGrad)" stroke-width="1.2"/>
    
    <!-- Left Crest Icon -->
    <circle cx="24" cy="19" r="12" fill="#1e3a8a" stroke="url(#goldGrad)" stroke-width="1"/>
    <text x="24" y="23" fill="#fbbf24" font-size="11" text-anchor="middle" font-weight="bold">🚌</text>

    <!-- Company Name and Service Details -->
    <text x="44" y="16" fill="#f8fafc" font-size="10" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" letter-spacing="0.6">CIA. DE TRANSPORTES GUAYTACAMA S.A.</text>
    <text x="44" y="29" fill="#93c5fd" font-size="7.5" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600">Flota Interparroquial · Latacunga - Cotopaxi · Unidad #14 VIP</text>

    <!-- 5 Stars Rating on Right -->
    <text x="336" y="22" fill="#fbbf24" font-size="8.5" text-anchor="end" letter-spacing="1.5">★★★★★</text>
  </g>
</svg>